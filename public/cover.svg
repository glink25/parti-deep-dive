<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Deep Dive: Sunken Signal</title>
  <desc id="desc">深海遗迹主题游戏封面：潜水器下潜到发光遗迹与宝藏之间，远处危险信号闪烁。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2f3e"/>
      <stop offset="0.55" stop-color="#04151e"/>
      <stop offset="1" stop-color="#02090d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="50%">
      <stop offset="0" stop-color="#3fc7d6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#3fc7d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cf5e6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9cf5e6" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
